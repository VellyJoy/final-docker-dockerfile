
name: Go CI/CD

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Go application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check code
        run: go vet ./...

      - name: Run tests
        run: go test ./...
